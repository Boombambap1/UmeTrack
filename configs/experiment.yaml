# Part B experiment configuration. Paths are relative to the repo root.

upstream:
  repo: https://github.com/facebookresearch/UmeTrack.git
  commit: e263ec0844abf73457468a050a75853444d33d69
  checkpoint: third_party/UmeTrack/pretrained_models/pretrained_weights.torch
  checkpoint_sha256: 72eab0ea2c5c4518188ede4cf62e98f62eb1e4ef13628c0f20ad3fc56d1bf18d  # shasum -a 256

encoder:
  module: _feature_extractor._image_backbone  # attribute path on the loaded UmeTrack model
  input:
    name: crops
    shape: [1, 1, 96, 96]
    dtype: float32
    layout: NCHW
    scale: "uint8 / 255"
  output:
    name: features
    shape: [1, 72, 6, 6]
    dtype: float32
    layout: NCHW
  onnx_opset: 17

sdk:
  qairt_version: "2.33.2.250410"  # must match on conversion host and board
  build_id: "250410134701_117956"  # from sdk.yaml
  zip: v2.33.2.250410.zip
  zip_sha256: 37487de4d9dd770f15826224bc915d138417eb44445ebe6bd8718b6ca172d617
  host_requirements: {os: "Ubuntu 22.04", python: "3.10"}  # ReleaseNotes.txt; check-python-dependency also allows 3.8
  host_tools: bin/x86_64-linux-clang           # snpe-onnx-to-dlc, snpe-dlc-info, snpe-dlc-quantize
  board_runtime_bin: bin/aarch64-oe-linux-gcc11.2  # snpe-net-run
  board_runtime_lib: lib/aarch64-oe-linux-gcc11.2  # libSNPE.so, libSnpeDspV66Stub.so
  dsp_lib: lib/hexagon-v66/unsigned            # libSnpeDspV66Skel.so (QRB5165 = Hexagon v66)
  conversion_host:  # docs/env_conversion_host.md; connection details stay in local ssh config
    alias: convhost
    os: "Ubuntu 22.04.5 LTS"
    arch: x86_64
    python: "3.10.12"
    sdk_root: ~/umetrack_b/qairt/qairt/2.33.2.250410
    venv: ~/umetrack_b/venv
    extra_ld_library_path: ~/umetrack_b/deps/usr/lib/llvm-14/lib  # user-space libc++1-14/libc++abi1-14/libunwind-14
    pip_deviation: "protobuf 3.20.3 (SDK pins 3.19.6; onnx 1.16.1 needs >=3.20.2)"
    status: "converter starts (--help exit 0)"
  board: rb5

data:
  recordings_dir: data/
  first_recording: raw_data/real/separate_hand/testing/user_19/recording_00

# proposed, agree with Steven before formal comparison; never loosen to pass
tolerances:
  onnx_vs_torch:
    max_abs: 1.0e-4
    rel_l2: 1.0e-5
  board_cpu_vs_onnx:
    max_abs: 1.0e-3
    rel_l2: 1.0e-4
  # development check on the conversion host (x86_64 snpe-net-run, Part B dev crops); not the RB5 experiment.
  # Declared 2026-11-26 before running it; same limits as board_cpu_vs_onnx.
  host_cpu_vs_onnx_dev:
    max_abs: 1.0e-3
    rel_l2: 1.0e-4
  pose_error_change_mm: 0.1

benchmark:
  warmup_runs: 10
  measured_runs: 100
  batch_size: 1
